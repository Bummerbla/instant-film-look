<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instant Film Look</title>
<style>
:root{color-scheme:light;--ink:#25251f;--muted:#77766f;--paper:#f7f4ec;--line:#dedbd2;--accent:#c76e4a}
*{box-sizing:border-box}body{margin:0;background:#efede7;color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.shell{max-width:1120px;margin:32px auto;padding:0 20px}.top{display:flex;align-items:end;justify-content:space-between;margin-bottom:20px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--accent);font-weight:700}h1{font:500 clamp(28px,4vw,42px)/1.08 Georgia,serif;margin:7px 0 5px}.sub{color:var(--muted);margin:0}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(290px,.8fr);gap:20px;align-items:start}.preview,.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px #322d2010}.preview{padding:20px;min-height:580px;display:grid;place-items:center;position:relative}.stage{width:min(100%,440px);position:relative}.stage canvas{display:block;width:100%;height:auto;border-radius:3px;box-shadow:0 18px 38px #332b2030}.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px;color:#77766f;background:#e5e1d8;border:1px dashed #bcb7aa;border-radius:12px;cursor:pointer}.empty strong{font:500 23px Georgia,serif;color:#45443e;margin-bottom:5px}.empty span{font-size:13px}.panel{padding:22px}.panel h2{font:500 22px Georgia,serif;margin:0 0 5px}.hint{font-size:13px;color:var(--muted);margin:0 0 18px}.drop{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:12px;border-radius:12px;margin-bottom:18px;background:#fffdf8}.drop input{width:100%;font-size:13px}.control{margin:16px 0}.labelrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:7px}.labelrow output{font-variant-numeric:tabular-nums;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--accent)}.caption{width:100%;border:1px solid var(--line);border-radius:9px;background:#fffdf8;padding:10px 11px;font:14px system-ui}.buttons{display:flex;gap:9px;margin-top:20px}.buttons button{flex:1;border:0;border-radius:10px;padding:12px 14px;font-weight:650;cursor:pointer}.save{color:white;background:#282821}.reset{background:#e9e5dc;color:#333}.note{font-size:12px;color:var(--muted);margin:15px 0 0}.status{font-size:12px;color:#a34f32;min-height:18px;margin-top:8px}@media(max-width:800px){.layout{grid-template-columns:1fr}.preview{min-height:0}.stage{width:min(100%,380px)}.top{align-items:start;flex-direction:column;gap:8px}}
</style>
</head>
<body><main class="shell"><header class="top"><div><div class="eyebrow">A little instant-film nostalgia</div><h1>Instant Film Look</h1><p class="sub">Give a photo warm, soft colors and a classic white frame.</p></div></header>
<div class="layout"><section class="preview" aria-label="Photo preview"><div class="stage"><canvas id="canvas" width="1200" height="1450" aria-label="Edited photo preview"></canvas><label class="empty" id="empty"><strong>Choose a photo</strong><span>Click here or drop an image to start</span></label></div></section>
<aside class="panel"><h2>Make it yours</h2><p class="hint">The preview updates as you adjust the look.</p><div class="drop"><label for="file"><b>Photo</b></label><input id="file" type="file" accept="image/*"></div>
<div class="control"><div class="labelrow"><label for="warm">Warmth</label><output id="warmOut">35</output></div><input id="warm" type="range" min="0" max="100" value="35"></div>
<div class="control"><div class="labelrow"><label for="fade">Fade & softness</label><output id="fadeOut">38</output></div><input id="fade" type="range" min="0" max="100" value="38"></div>
<div class="control"><div class="labelrow"><label for="grain">Film grain</label><output id="grainOut">18</output></div><input id="grain" type="range" min="0" max="60" value="18"></div>
<div class="control"><div class="labelrow"><label for="shade">Edge shading</label><output id="shadeOut">20</output></div><input id="shade" type="range" min="0" max="60" value="20"></div>
<div class="control"><div class="labelrow"><label for="frame">Frame size</label><output id="frameOut">Classic</output></div><input id="frame" type="range" min="0" max="100" value="55"></div>
<div class="control"><div class="labelrow"><label for="caption">Bottom caption</label></div><input class="caption" id="caption" maxlength="32" placeholder="Add a date or little note"></div>
<div class="buttons"><button class="save" id="save">Save print image</button><button class="reset" id="reset">Reset</button></div><div class="status" id="status" role="status"></div><p class="note">Tip: save the PNG, then print it on glossy photo paper. For a thicker keepsake, mount the print on card.</p></aside></div></main>
<script>
(()=>{
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),file=document.getElementById('file'),empty=document.getElementById('empty'),status=document.getElementById('status');let photo=null;
const controls=['warm','fade','grain','shade','frame','caption'];
function render(){const W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);const margin=72, top=72, frameValue=+document.getElementById('frame').value, bottom=100+(100-frameValue)*1.2, areaW=W-margin*2, areaH=H-top-bottom; if(photo){let scale=Math.max(areaW/photo.width,areaH/photo.height),sw=areaW/scale,sh=areaH/scale,sx=(photo.width-sw)/2,sy=(photo.height-sh)/2;ctx.save();ctx.beginPath();ctx.rect(margin,top,areaW,areaH);ctx.clip();ctx.drawImage(photo,sx,sy,sw,sh,margin,top,areaW,areaH);ctx.restore();let d=ctx.getImageData(margin,top,areaW,areaH),p=d.data,warm=+document.getElementById('warm').value/100,fade=+document.getElementById('fade').value/100,grain=+document.getElementById('grain').value/100;for(let i=0;i<p.length;i+=4){let r=p[i],g=p[i+1],b=p[i+2],l=.299*r+.587*g+.114*b;let sat=1-fade*.27;r=l+(r-l)*sat;g=l+(g-l)*sat;b=l+(b-l)*sat;let contrast=1-fade*.12;r=(r-128)*contrast+128+fade*15;g=(g-128)*contrast+128+fade*12;b=(b-128)*contrast+128+fade*7;let n=(Math.random()-.5)*grain*40;r+=warm*16+n;g+=warm*6+n;b-=warm*12-n;let x=(i/4)%areaW,y=Math.floor((i/4)/areaW),dx=(x-areaW/2)/(areaW*.72),dy=(y-areaH/2)/(areaH*.72),v=Math.max(0,dx*dx+dy*dy-.35)*(+document.getElementById('shade').value/100)*35;r-=v;g-=v;b-=v;p[i]=Math.max(0,Math.min(255,r));p[i+1]=Math.max(0,Math.min(255,g));p[i+2]=Math.max(0,Math.min(255,b));}ctx.putImageData(d,margin,top);}
const f=+document.getElementById('frame').value;const extra=Math.round((100-f)*.45);ctx.fillStyle='#ffffff';ctx.fillRect(0,top+areaH+8,W,H-(top+areaH+8));ctx.fillStyle='#46433d';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='italic 34px Georgia,serif';let caption=document.getElementById('caption').value.trim();if(caption)ctx.fillText(caption,W/2,H-75, W-120);empty.style.display=photo?'none':'grid';
}
function sync(){for(const id of controls){const el=document.getElementById(id);const out=document.getElementById(id+'Out');if(out)out.textContent=id==='frame'?(+el.value>70?'Slim':+el.value<30?'Wide':'Classic'):el.value;}render()}
file.addEventListener('change',()=>{const f=file.files&&file.files[0];if(!f)return;if(!f.type.startsWith('image/')){status.textContent='Please choose an image file.';return}const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{photo=im;empty.style.display='none';status.textContent='';render();URL.revokeObjectURL(u)};im.onerror=()=>{status.textContent='That image could not be opened.';URL.revokeObjectURL(u)};im.src=u});
empty.addEventListener('click',()=>file.click());for(const id of controls)document.getElementById(id).addEventListener(id==='caption'?'input':'input',sync);
const stage=document.querySelector('.stage');stage.addEventListener('dragover',e=>{e.preventDefault()});stage.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files.length){file.files=e.dataTransfer.files;file.dispatchEvent(new Event('change'))}});
document.getElementById('save').addEventListener('click',()=>{if(!photo){status.textContent='Choose a photo first.';return}canvas.toBlob(blob=>{if(!blob){status.textContent='Could not save this image.';return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='instant-film-look.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);status.textContent='Saved as a print-ready PNG.'},'image/png')});
document.getElementById('reset').addEventListener('click',()=>{document.getElementById('warm').value=35;document.getElementById('fade').value=38;document.getElementById('grain').value=18;document.getElementById('shade').value=20;document.getElementById('frame').value=55;document.getElementById('caption').value='';sync()});render();
})();
</script></body></html>
